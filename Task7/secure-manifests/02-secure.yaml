apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-hostpath-fixed
  namespace: audit-zone
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: app-data
      emptyDir: {}
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: app-data
          mountPath: /tmp/app-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
